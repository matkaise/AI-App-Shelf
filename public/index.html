<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Shelf</title>
    <link rel="icon" href="/app-shelf-logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/render.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="shelf"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <dialog id="settingsDialog" class="settings-dialog">
      <form id="settingsForm" class="settings-form">
        <div class="settings-head">
          <div>
            <p class="settings-eyebrow">Sync</p>
            <h2 class="settings-title">Settings</h2>
          </div>
          <button id="closeSettingsBtn" class="close-btn" type="button" aria-label="Close">&times;</button>
        </div>
        <label class="settings-label">
          <span>GitHub Repo</span>
          <input id="repoInput" class="settings-input" placeholder="owner/name" autocomplete="off" />
        </label>
        <div class="settings-split">
          <label class="settings-label">
            <span>Branch</span>
            <input id="branchInput" class="settings-input" placeholder="main" autocomplete="off" />
          </label>
          <label class="settings-label">
            <span>File</span>
            <input id="fileInput" class="settings-input" placeholder="apps.json" autocomplete="off" />
          </label>
        </div>
        <label class="settings-label">
          <span>GitHub Token</span>
          <input id="tokenInput" class="settings-input" type="password" autocomplete="off" placeholder="Enter a new token" />
        </label>
        <label class="settings-check-row">
          <input id="clearTokenInput" type="checkbox" />
          <span>Clear saved token</span>
        </label>
        <p id="settingsMeta" class="settings-meta"></p>
        <div class="settings-footer">
          <button id="saveSettingsBtn" class="settings-save-btn" type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
